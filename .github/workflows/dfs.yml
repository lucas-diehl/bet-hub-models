name: dfs

# DFS ENGINE daily run — scrapes DK slates, builds projections, and publishes the
# optimizer pool feed (pool_*.json) + value plays the Bet Hub /dfs page reads.
# Also refreshes the golf H2H picks via the sibling golf-modeling checkout.
on:
  schedule:
    # Minutes are deliberately OFF the top of the hour (changed 2026-11-13): GitHub
    # documents heavy scheduler load at :00, and for the week of 2026-11-06..13 the
    # "0 11" and "0 14" slots below never fired at all (first run of every day was
    # ~13:20 ET), leaving ONE pre-lock build on Sun 11-08. nfl.yml now also dispatches
    # this workflow directly whenever it pushes fresh NFL projections.
    - cron: "23 11 * * *"  # ~06:23 ET (EST) — early, so morning slates are fresh
    - cron: "23 14 * * *"  # ~09:23 ET (EST)
    - cron: "35 16 * * 0"  # SUNDAY ~11:35 ET under EST (Nov-Mar): the 15:40 slot below is
                           # 10:40 EST, i.e. BEFORE the ~11:30 inactives once clocks fall back.
    - cron: "40 15 * * 0"  # ~11:40 ET (EDT), SUNDAY ONLY — closes the pre-1pm-kickoff inactive
                           # gap. ESPN's injury feed (apply_inactives(), the only inactive-
                           # detection in the daily path) is freshness-dependent by design;
                           # official NFL inactives land ~90 min before kickoff (~11:30 ET
                           # for the 1pm window), which used to sit stranded between the
                           # 10:00 and 13:00 ET runs — the 10:00 build had no idea who was
                           # about to be scratched, and by 13:00 the 1pm slate was already
                           # locked. This run refreshes right after that announcement window.
    - cron: "23 17 * * *"  # ~12:23 ET (EST)
    - cron: "23 20 * * *"  # ~15:23 ET (EST)
    - cron: "23 23 * * *"  # ~18:23 ET (EST)
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma list (blank = all sports, incl. round/captain golf + ncaaf)"
        required: false

concurrency:
  group: dfs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_DIR: ${{ github.workspace }}/_feed
      R_LIBS_USER: ${{ github.workspace }}/.rlib
      DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
      # Actual %Drafted is only downloadable by a logged-in ENTRANT, so this cookie is
      # what turns on real ownership capture. run_all.R already calls sync_ownership() +
      # auto_import_ownership(); without the cookie those no-op silently, which is why
      # every NFL/NCAAF ownership row to date has been our own projection, never an actual.
      # Optional: if the secret is unset the engine behaves exactly as before.
      DK_COOKIE: ${{ secrets.DK_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-dfs-${{ runner.os }}-${{ hashFiles('.github/workflows/dfs.yml') }}
          restore-keys: rlib-dfs-${{ runner.os }}-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          # stringi ships a compiled .so linked against a specific system ICU version; the
          # rlib-dfs-* cache persists it across runs, so it goes stale the moment GitHub
          # bumps the runner image (same failure as cfb.yml, see that file's comment --
          # confirmed live here too 2026-11-02, breaking every scheduled DFS run). Probe
          # before trusting "already installed" from the cache, force a reinstall if broken.
          Rscript -e 'ok <- tryCatch({ library(stringi); TRUE }, error = function(e) { cat("stringi failed to load from cache:", conditionMessage(e), "\n"); FALSE }); if (!ok) { cat("forcing a fresh stringi reinstall\n"); install.packages("stringi") }'
          Rscript -e 'p<-c("data.table","jsonlite","httr2","xgboost","openxlsx","DBI","duckdb","lpSolve"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'
          # wehoop (WNBA box scores) -- same gap, same fix as train.yml. Daily log showed
          # "box refresh failed: install.packages('wehoop')" here too (a live-serving box
          # refresh, separate from the daily retrain) on every run.
          Rscript -e 'if (!("wehoop" %in% rownames(installed.packages()))) install.packages("wehoop", repos = c("https://sportsdataverse.r-universe.dev", getOption("repos")))'

      # The DuckDB is where logged ownership + projections + salaries ACCUMULATE, and the
      # ownership model needs >=5 slates of history before it will train. A fresh empty db
      # each run meant every captured %Drafted row was thrown away at job end, so no sport
      # could ever cross that threshold from CI. Rolling key: restore newest, save every run.
      - name: Restore DFS DuckDB
        uses: actions/cache/restore@v4
        with:
          path: dfs-engine/data/dfs.duckdb
          key: dfs-duckdb-${{ github.run_id }}
          restore-keys: dfs-duckdb-

      - name: Init DuckDB schema
        # db_bootstrap() is idempotent: it creates the schema on a cold runner (no cache
        # yet) and is a no-op once the restored db already has the tables.
        working-directory: dfs-engine
        run: Rscript -e 'source("bootstrap.R"); dfs_load_spine(); invisible(db_bootstrap()); cat("duckdb schema ready\n")'

      - name: Run DFS engine (pool + value + round feeds; all sports by default)
        working-directory: dfs-engine
        run: |
          SPORTS="${{ github.event.inputs.sports }}"
          if [ -n "$SPORTS" ]; then
            Rscript jobs/run_all.R --bankroll 300 --sports "$SPORTS"
          else
            Rscript jobs/run_all.R --bankroll 300   # run_all's full default sport set
          fi

      - name: Ingest to Supabase
        uses: ./.github/actions/ingest
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          feed-dir: ${{ github.workspace }}/_feed

      - name: Save DFS DuckDB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dfs-engine/data/dfs.duckdb
          key: dfs-duckdb-${{ github.run_id }}
