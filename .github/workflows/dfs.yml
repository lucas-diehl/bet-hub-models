name: dfs

# DFS ENGINE daily run — scrapes DK slates, builds projections, and publishes the
# optimizer pool feed (pool_*.json) + value plays the Bet Hub /dfs page reads.
# Also refreshes the golf H2H picks via the sibling golf-modeling checkout.
on:
  schedule:
    - cron: "0 11 * * *"   # ~07:00 ET — early, so morning slates are fresh
    - cron: "0 14 * * *"   # ~10:00 ET
    - cron: "0 17 * * *"   # ~13:00 ET
    - cron: "0 20 * * *"   # ~16:00 ET
    - cron: "0 23 * * *"   # ~19:00 ET
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma list (blank = all sports, incl. round/captain golf + ncaaf)"
        required: false

concurrency:
  group: dfs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_DIR: ${{ github.workspace }}/_feed
      R_LIBS_USER: ${{ github.workspace }}/.rlib
      DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
      # Actual %Drafted is only downloadable by a logged-in ENTRANT, so this cookie is
      # what turns on real ownership capture. run_all.R already calls sync_ownership() +
      # auto_import_ownership(); without the cookie those no-op silently, which is why
      # every NFL/NCAAF ownership row to date has been our own projection, never an actual.
      # Optional: if the secret is unset the engine behaves exactly as before.
      DK_COOKIE: ${{ secrets.DK_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-dfs-${{ runner.os }}-${{ hashFiles('.github/workflows/dfs.yml') }}
          restore-keys: rlib-dfs-${{ runner.os }}-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'p<-c("data.table","jsonlite","httr2","xgboost","openxlsx","DBI","duckdb","lpSolve"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'

      # The DuckDB is where logged ownership + projections + salaries ACCUMULATE, and the
      # ownership model needs >=5 slates of history before it will train. A fresh empty db
      # each run meant every captured %Drafted row was thrown away at job end, so no sport
      # could ever cross that threshold from CI. Rolling key: restore newest, save every run.
      - name: Restore DFS DuckDB
        uses: actions/cache/restore@v4
        with:
          path: dfs-engine/data/dfs.duckdb
          key: dfs-duckdb-${{ github.run_id }}
          restore-keys: dfs-duckdb-

      - name: Init DuckDB schema
        # db_bootstrap() is idempotent: it creates the schema on a cold runner (no cache
        # yet) and is a no-op once the restored db already has the tables.
        working-directory: dfs-engine
        run: Rscript -e 'source("bootstrap.R"); dfs_load_spine(); invisible(db_bootstrap()); cat("duckdb schema ready\n")'

      - name: Run DFS engine (pool + value + round feeds; all sports by default)
        working-directory: dfs-engine
        run: |
          SPORTS="${{ github.event.inputs.sports }}"
          if [ -n "$SPORTS" ]; then
            Rscript jobs/run_all.R --bankroll 300 --sports "$SPORTS"
          else
            Rscript jobs/run_all.R --bankroll 300   # run_all's full default sport set
          fi

      - name: Ingest to Supabase
        uses: ./.github/actions/ingest
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          feed-dir: ${{ github.workspace }}/_feed

      - name: Save DFS DuckDB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dfs-engine/data/dfs.duckdb
          key: dfs-duckdb-${{ github.run_id }}
