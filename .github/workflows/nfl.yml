name: nfl

# NFL published-picks pipeline for the Bet Hub feed.
#   publish-spread-total  Tue 9am ET — weekly refresh of the shared infra this slot
#                 originally existed for spread/total staking to use: snap features,
#                 full-slate lean file, DK salary capture, fantasy projections + DFS
#                 feeds. No spread/total staking any more (removed 2026-10-13 for TD,
#                 2026-10-21 for spread/total - "we don't use those") and grading moved
#                 to its own daily cron (see "grade" below), so this job name is now a
#                 misnomer kept for continuity with the existing cron/dispatch wiring.
#                 The ledger is append-only and frozen per bet, so re-running is safe.
#   publish-full  Sun 6am ET — publish-spread-total's full step list PLUS the
#                 day-scoped TD publish for today (Sunday's games only).
#   td-publish    Thu 9am ET + Mon 9am ET — TD board refresh + day-scoped TD
#                 staking + Touchdowns-tab board, for TODAY'S games only (a
#                 Sunday game never gets staked on this Thursday's run). Does
#                 NOT touch the spread/total model at all (skips the ~15-20
#                 min seed-averaged RF refit) - cheap, TD-only.
#   td-refresh    2x daily (~9am/~2pm ET) — repost the Touchdowns-tab board
#                 (one props_<date>.json per game day this week) WITHOUT
#                 staking anything, so it tracks the live market between
#                 publish/td-publish runs.
#   capture-close Thu + Sun — snapshot near-kickoff lines for closing-line
#                 value (CLV).
#   grade         ~08:00 ET daily — grade whatever's gradeable in the ledger (TD picks;
#                 spread/total staking was removed 2026-10-21, so there's nothing else
#                 left to grade here). Self-gated/idempotent, same as publish-spread-
#                 total used to do inline on Tuesdays only - this makes it daily, for
#                 every sport, per owner direction. Also available via workflow_dispatch
#                 for an ad hoc regrade.
#   retrain-td    workflow_dispatch only. Re-fits + re-saves data/processed/
#                 td_deployment_model.rds under whatever xgboost version THIS
#                 runner currently has installed, via scripts/13_train_td_model.R.
#                 xgb.save.raw()'s raw JSON payload is not guaranteed stable
#                 across xgboost releases (R/utilities.R's revive_booster() says
#                 so directly) -- this runner had drifted to xgboost 3.2.1.1
#                 against a model saved under 1.7.9.1, and xgb.load.raw() failed
#                 on every run touching the TD board from at least 2026-10-11
#                 until found + fixed 2026-10-14, entirely silently because
#                 every step here is wrapped in `|| echo`. Fixed for now by
#                 PINNING xgboost (see the install step below) rather than by
#                 running this job -- scripts/13 needs data/processed/
#                 td_player_features.rds + td_prop_board.rds, and neither is in
#                 this workflow's cache (confirmed: a 2026-10-14 dispatch of
#                 this job failed on a missing td_player_features.rds). Treat
#                 retrain-td as aspirational until whatever script(s) produce
#                 those two files are also wired in here; the version PIN is
#                 the real fix today.
#   retrain-fantasy  workflow_dispatch only. Forces scripts/17_build_fantasy_
#                 prop_models.R --retrain, re-fitting + re-caching data/processed/
#                 fantasy_prop_deployment_models.rds (gitignored, cache-only --
#                 restored/saved by the "NFL data + outputs" cache steps below,
#                 same as td_deployment_model.rds but never committed). Found
#                 2026-10-17: that cache predates fit_fantasy_stat_model()'s own
#                 portable_booster() call (R/fantasy_prop_model.R:1193), so every
#                 normal run's SCORING step (line 1169's publish-* path, which
#                 only ever passes --execute, never --retrain) called
#                 revive_booster() on a dead, attribute-less pointer and threw --
#                 this is what left fantasy_prop_*_week*_projections.csv stuck on
#                 week 4 well into week 6. Unlike retrain-td, this job's inputs
#                 (player_stats_2021_2026.rds, td_game_context.rds) ARE already
#                 restored by the shared cache-restore step, so it actually runs
#                 end to end. One dispatch repopulates the cache correctly;
#                 every subsequent normal run reuses it until the next deliberate
#                 model change or xgboost bump forces another one of these.
#
# NFL is STATEFUL: the frozen-pick ledger (data/processed/published_picks_ledger.csv),
# the closing-line capture (data/processed/closing_line_capture.csv), and the latest
# fantasy-prop projections (NFL/outputs, needed by the TD fantasy signal on the
# td-publish days that don't run scripts/17 themselves) must survive between runs,
# so NFL/data AND NFL/outputs are cached with a rolling key (restored newest, saved
# each run). Best-effort cron (GitHub may fire 5-20 min late); fine for daily/weekly picks.
on:
  schedule:
    - cron: "0 14 * * 2"   # Tue ~09:00 ET — weekly infra refresh (see publish-spread-total above)
    - cron: "0 10 * * 0"   # Sun ~06:00 ET — full publish (weekly infra refresh + TD for today)
    - cron: "0 14 * * 4"   # Thu ~09:00 ET — td-publish (TD for today only)
    - cron: "0 14 * * 1"   # Mon ~09:00 ET — td-publish (TD for today only)
    - cron: "0 13 * * *"   # ~09:00 ET daily — td-refresh (board only, no stakes)
    - cron: "0 18 * * *"   # ~14:00 ET daily — td-refresh (board only, no stakes)
    - cron: "0 12 * * *"   # ~08:00 ET daily — grade (self-gated; a day with nothing newly
                            # final is a cheap no-op)
    - cron: "0 23 * * 4"   # Thu ~19:00 ET — capture close before TNF (~20:15 ET kickoff)
    - cron: "0 15 * * 0"   # Sun ~11:00 ET — capture close before the 13:00 ET slate
  workflow_dispatch:
    inputs:
      job:
        description: "publish-spread-total | publish-full | td-publish | td-refresh | capture-close | grade | retrain-td | retrain-fantasy (blank = pick from the schedule)"
        required: false
      day:
        description: "YYYY-MM-DD game day for td-publish/publish-full (blank = today, America/New_York)"
        required: false
      season:
        description: "NFL_SEASON (blank = auto)"
        required: false

concurrency:
  group: nfl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_DIR: ${{ github.workspace }}/_feed
      R_LIBS_USER: ${{ github.workspace }}/.rlib
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      NFL_FEED_MODE: LIVE
      NFL_SEASON: ${{ github.event.inputs.season }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-nfl-${{ runner.os }}-${{ hashFiles('.github/workflows/nfl.yml') }}
          restore-keys: rlib-nfl-${{ runner.os }}-

      # Rolling key: restore the newest prior NFL/data + NFL/outputs (nflverse
      # cache + ledger + closing-line capture + latest fantasy-prop
      # projections), save a fresh copy each run so state accumulates.
      # NFL/outputs added 2026-10-13: the Thu/Mon td-publish runs don't run
      # scripts/17 (fantasy projections) themselves, so without this the TD
      # fantasy signal would silently degrade to market+fundamental-only on
      # those two days every week - carrying Sunday's outputs/ forward instead
      # lands within td_fantasy_signal_live()'s own 8-day staleness tolerance.
      - name: Restore NFL data + outputs (nflverse cache, ledger, CLV, fantasy projections)
        uses: actions/cache/restore@v4
        with:
          path: |
            NFL/data
            NFL/outputs
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'p<-c("nflfastR","nflreadr","dplyr","tidyr","purrr","slider","readr","stringr","lubridate","yaml","jsonlite","httr2","ranger","nnet","ggplot2","data.table","mgcv","tibble"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'
          # xgboost is pinned, not left to float to CRAN's latest. The deployment
          # model (data/processed/td_deployment_model.rds) is saved as a PORTABLE
          # raw payload specifically because a trained booster doesn't survive
          # save/load across xgboost releases (R/utilities.R's revive_booster()
          # says so directly) -- but that payload isn't guaranteed to decode under
          # a DIFFERENT xgboost version than the one that wrote it either. This
          # runner had drifted to 3.2.1.1 against a model saved under 1.7.9.1 (the
          # version scripts/13_train_td_model.R was last run with), and
          # xgb.load.raw() silently failed on every run touching the TD board from
          # at least 2026-10-11 until this was found and pinned (2026-10-14).
          # Bump this pin deliberately, together with a fresh retrain-td run,
          # never by letting it float.
          Rscript -e 'if (!identical(tryCatch(as.character(packageVersion("xgboost")), error=function(e) NA), "1.7.9.1")) { if (!("remotes" %in% rownames(installed.packages()))) install.packages("remotes"); remotes::install_version("xgboost", version = "1.7.9.1", upgrade = "never", repos = "https://cran.r-project.org") }'
          Rscript -e 'cat("xgboost version installed:", as.character(packageVersion("xgboost")), "\n")'

      - name: Run NFL job (publish-spread-total / publish-full / td-publish / td-refresh / capture-close / grade)
        working-directory: NFL
        run: |
          JOB="${{ github.event.inputs.job }}"
          DAY_ARG=""
          if [ -n "${{ github.event.inputs.day }}" ]; then
            DAY_ARG="--day=${{ github.event.inputs.day }}"
          fi
          if [ -z "$JOB" ]; then
            case "${{ github.event.schedule }}" in
              "0 14 * * 2") JOB="publish-spread-total" ;;
              "0 10 * * 0") JOB="publish-full" ;;
              "0 14 * * 4") JOB="td-publish" ;;
              "0 14 * * 1") JOB="td-publish" ;;
              "0 13 * * *") JOB="td-refresh" ;;
              "0 18 * * *") JOB="td-refresh" ;;
              "0 12 * * *") JOB="grade" ;;
              *)            JOB="capture-close" ;;
            esac
          fi
          echo "NFL job = $JOB  day = ${DAY_ARG:-<today>}"

          run_td_publish() {
            Rscript scripts/15_build_2026_td_board.R --execute --refresh-stats || echo "TD board refresh failed; nothing to stake this run."
            Rscript scripts/90_publish_td_picks.R --execute $DAY_ARG
            Rscript scripts/88_emit_td_prop_board.R --execute || echo "Touchdown prop board failed; picks were still published."
          }

          if [ "$JOB" = "publish-spread-total" ] || [ "$JOB" = "publish-full" ]; then
            Rscript scripts/86_build_snap_features.R || echo "Snap-share refresh failed; continuing with the cached file."
            Rscript scripts/73_td_redzone_features.R || echo "Redzone/xTD feature refresh failed; continuing with the cached file."
            Rscript scripts/57_publish_weekly_picks.R --execute
            Rscript scripts/78_nfl_write_slate.R --execute || echo "Slate board write failed; picks were still published."
            Rscript scripts/21_capture_current_dk_salaries.R || echo "DK salary capture failed; continuing without fresh salaries."
            Rscript scripts/81_build_current_salary_table.R || echo "Salary table build failed; capture archive is still saved."
            Rscript scripts/17_build_fantasy_prop_models.R --execute || echo "Fantasy projection refresh failed; picks were still published."
            Rscript scripts/59_emit_dfs_projection_json.R || echo "DFS ENGINE projection JSON failed; CSV projections still written."
            Rscript scripts/82_emit_dfs_values_feed.R --execute || echo "DFS values feed failed; projections still written."
            if [ "$JOB" = "publish-full" ]; then
              run_td_publish
            fi
            # Grading used to run inline here too (Tuesdays only). Moved to its own
            # daily 8am-ET cron (see JOB="grade" below) 2026-10-21 so it isn't tied to
            # the weekly publish cadence; left out here to avoid grading twice the same
            # day.
          elif [ "$JOB" = "td-publish" ]; then
            run_td_publish
          elif [ "$JOB" = "td-refresh" ]; then
            Rscript scripts/15_build_2026_td_board.R --execute || echo "Touchdown board refresh failed; prop board not rebuilt."
            Rscript scripts/88_emit_td_prop_board.R --execute || echo "Touchdown prop board failed."
          elif [ "$JOB" = "grade" ]; then
            Rscript scripts/58_grade_published_picks.R --grade --execute
          elif [ "$JOB" = "retrain-td" ]; then
            Rscript scripts/13_train_td_model.R
          elif [ "$JOB" = "retrain-fantasy" ]; then
            Rscript scripts/17_build_fantasy_prop_models.R --retrain --execute
            Rscript scripts/59_emit_dfs_projection_json.R || echo "DFS ENGINE projection JSON failed; CSV projections still written."
          else
            Rscript scripts/58_grade_published_picks.R --capture-close --execute
          fi

      - name: Ingest to Supabase
        uses: ./.github/actions/ingest
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          feed-dir: ${{ github.workspace }}/_feed
          post-to-x: "true"
          x-api-key: ${{ secrets.X_API_KEY }}
          x-api-secret: ${{ secrets.X_API_SECRET }}
          x-access-token: ${{ secrets.X_ACCESS_TOKEN }}
          x-access-token-secret: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Save NFL data + outputs (persist ledger + CLV snapshots + fantasy projections)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            NFL/data
            NFL/outputs
          key: nfl-data-${{ github.run_id }}
