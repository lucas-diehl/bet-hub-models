name: nfl

# NFL published-picks pipeline for the Bet Hub feed.
#   publish       Tue 9am ET + Sun 6am ET  — full weekly refresh: snap features,
#                 TD board, publish picks, slate board, TD prop board, DK salary
#                 capture, fantasy projections + DFS feeds, grade last week.
#                 Sunday's run is the "lock-in" pass: new TD plays that clear
#                 the board only once books open Sunday markets get staked here,
#                 on top of (never replacing) anything already posted Tuesday -
#                 the ledger is append-only and frozen per bet, so re-running
#                 publish is always safe.
#   td-refresh    2x daily (~9am/~2pm ET) — repost the TD board + prop feed
#                 WITHOUT staking anything, so the Touchdowns tab tracks the
#                 live market between publish runs.
#   capture-close Thu + Sun — snapshot near-kickoff lines for closing-line
#                 value (CLV).
#   grade         available via workflow_dispatch for an ad hoc regrade.
#
# NFL is STATEFUL: the frozen-pick ledger (data/processed/published_picks_ledger.csv)
# and the closing-line capture (data/processed/closing_line_capture.csv) must survive
# between runs, so NFL/data is cached with a rolling key (restored newest, saved each run).
# Best-effort cron (GitHub may fire 5-20 min late); fine for daily/weekly picks.
on:
  schedule:
    - cron: "0 14 * * 2"   # Tue ~09:00 ET — full publish + grade last week
    - cron: "0 10 * * 0"   # Sun ~06:00 ET — lock-in: full publish again
    - cron: "0 13 * * *"   # ~09:00 ET daily — td-refresh (board only, no stakes)
    - cron: "0 18 * * *"   # ~14:00 ET daily — td-refresh (board only, no stakes)
    - cron: "0 23 * * 4"   # Thu ~19:00 ET — capture close before TNF (~20:15 ET kickoff)
    - cron: "0 15 * * 0"   # Sun ~11:00 ET — capture close before the 13:00 ET slate
  workflow_dispatch:
    inputs:
      job:
        description: "publish | td-refresh | capture-close | grade (blank = pick from the schedule)"
        required: false
      season:
        description: "NFL_SEASON (blank = auto)"
        required: false

concurrency:
  group: nfl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_DIR: ${{ github.workspace }}/_feed
      R_LIBS_USER: ${{ github.workspace }}/.rlib
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      NFL_FEED_MODE: LIVE
      NFL_SEASON: ${{ github.event.inputs.season }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-nfl-${{ runner.os }}-${{ hashFiles('.github/workflows/nfl.yml') }}
          restore-keys: rlib-nfl-${{ runner.os }}-

      # Rolling key: restore the newest prior NFL/data (nflverse cache + ledger +
      # closing-line capture), save a fresh copy each run so state accumulates.
      - name: Restore NFL data (nflverse cache + ledger + CLV snapshots)
        uses: actions/cache/restore@v4
        with:
          path: NFL/data
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'p<-c("nflfastR","nflreadr","dplyr","tidyr","purrr","slider","readr","stringr","lubridate","yaml","jsonlite","httr2","ranger","xgboost","nnet","ggplot2","data.table","mgcv","tibble"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'

      - name: Run NFL job (publish / td-refresh / capture-close / grade)
        working-directory: NFL
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            case "${{ github.event.schedule }}" in
              "0 14 * * 2") JOB="publish" ;;
              "0 10 * * 0") JOB="publish" ;;
              "0 13 * * *") JOB="td-refresh" ;;
              "0 18 * * *") JOB="td-refresh" ;;
              *)            JOB="capture-close" ;;
            esac
          fi
          echo "NFL job = $JOB"
          # 15_build_2026_td_board.R hard-requires data/processed/td_redzone_features.rds
          # (built by scripts/73) and has been failing EVERY run on Actions since that
          # feature was added -- it was only ever generated by a local-machine task that
          # has since been disabled, so the file never existed on the runner and was never
          # in the cached NFL/data to begin with. Confirmed live 2026-10-08: every td-refresh
          # run errored "Missing data/processed/td_redzone_features.rds", so 15 silently fell
          # through to its `|| echo` fallback, the board never rebuilt, and the site kept
          # re-serving the prior week's stale TD props indefinitely. Cheap (~1 min locally,
          # full 2018-2026 PBP pull via nflreadr) -- run it before BOTH board-build call
          # sites so a cold cache self-heals instead of failing forever.
          if [ "$JOB" = "publish" ] || [ "$JOB" = "td-refresh" ]; then
            Rscript scripts/73_td_redzone_features.R || echo "Red-zone feature refresh failed; TD board build will likely fail too."
          fi
          if [ "$JOB" = "publish" ]; then
            Rscript scripts/86_build_snap_features.R || echo "Snap-share refresh failed; continuing with the cached file."
            Rscript scripts/15_build_2026_td_board.R --execute --refresh-stats || echo "TD board refresh failed; publishing game-level bets only."
            Rscript scripts/57_publish_weekly_picks.R --execute
            Rscript scripts/78_nfl_write_slate.R --execute || echo "Slate board write failed; picks were still published."
            Rscript scripts/88_emit_td_prop_board.R --execute || echo "Touchdown prop board failed; picks were still published."
            Rscript scripts/21_capture_current_dk_salaries.R || echo "DK salary capture failed; continuing without fresh salaries."
            Rscript scripts/81_build_current_salary_table.R || echo "Salary table build failed; capture archive is still saved."
            Rscript scripts/17_build_fantasy_prop_models.R --execute || echo "Fantasy projection refresh failed; picks were still published."
            Rscript scripts/59_emit_dfs_projection_json.R || echo "DFS ENGINE projection JSON failed; CSV projections still written."
            Rscript scripts/82_emit_dfs_values_feed.R --execute || echo "DFS values feed failed; projections still written."
            Rscript scripts/58_grade_published_picks.R --grade --execute || echo "grade: nothing final to grade yet"
          elif [ "$JOB" = "td-refresh" ]; then
            Rscript scripts/15_build_2026_td_board.R --execute || echo "Touchdown board refresh failed; prop board not rebuilt."
            Rscript scripts/88_emit_td_prop_board.R --execute || echo "Touchdown prop board failed."
          elif [ "$JOB" = "grade" ]; then
            Rscript scripts/58_grade_published_picks.R --grade --execute
          else
            Rscript scripts/58_grade_published_picks.R --capture-close --execute
          fi

      - name: Ingest to Supabase
        uses: ./.github/actions/ingest
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          feed-dir: ${{ github.workspace }}/_feed
          post-to-x: "true"
          x-api-key: ${{ secrets.X_API_KEY }}
          x-api-secret: ${{ secrets.X_API_SECRET }}
          x-access-token: ${{ secrets.X_ACCESS_TOKEN }}
          x-access-token-secret: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Save NFL data (persist ledger + CLV snapshots)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: NFL/data
          key: nfl-data-${{ github.run_id }}
