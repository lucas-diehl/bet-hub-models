name: train

# Weekly model retrain in the cloud, so the laptop isn't needed for training either.
# Fetches fresh stats (wehoop for WNBA, etc.), retrains each sport's projection model,
# and COMMITS the new data/models/*.rds back to the repo — the daily dfs workflow then
# runs those committed weights. Cheap no-op weeks commit nothing.
#
# Runs Sunday early so fresh weights are in place before the day's DFS slate builds.
# UNTESTED until its first run — expect a shakeout (data-source availability, packages).
on:
  schedule:
    - cron: "0 9 * * 0"   # Sun ~05:00 ET
  workflow_dispatch:
    inputs:
      sports:
        description: "Space-separated sports to retrain (default: wnba)"
        required: false

permissions:
  contents: write   # commit retrained models back to the repo

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-train-${{ runner.os }}-${{ hashFiles('.github/workflows/train.yml') }}
          restore-keys: rlib-train-${{ runner.os }}-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'p<-c("data.table","jsonlite","xgboost","nnet","wehoop"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'

      - name: Retrain models (per sport, tolerant)
        working-directory: dfs-engine
        run: |
          SPORTS="${{ github.event.inputs.sports }}"
          if [ -z "$SPORTS" ]; then SPORTS="wnba"; fi
          for s in $SPORTS; do
            echo "=== training $s ==="
            Rscript jobs/train_models.R --sport "$s" || echo "training $s failed — skipped"
          done

      - name: Commit retrained models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs-engine/data/models
          if git diff --cached --quiet; then
            echo "no model changes to commit"
          else
            git commit -m "train: retrained DFS models $(date -u +%F) [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
