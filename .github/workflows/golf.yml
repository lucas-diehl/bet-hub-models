name: golf

# Live 72-hole matchup + top-10 picks (and grading) for the Bet Hub feed.
# Cron is best-effort (GitHub may run it 5-20 min late); that's fine for daily picks.
on:
  schedule:
    - cron: "0 13 * * *"   # ~09:00 ET daily — live pull + price + merge picks
    - cron: "0 22 * * *"   # ~18:00 ET daily — refresh with closing-er lines
  workflow_dispatch:
    inputs:
      results_date:
        description: "Grade a settled slate (YYYY-MM-DD). Leave blank for a live picks run."
        required: false

concurrency:
  group: golf
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_DIR: ${{ github.workspace }}/_feed
      R_LIBS_USER: ${{ github.workspace }}/.rlib
      DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true   # binary Linux packages from Posit PM — fast installs

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-golf-${{ runner.os }}-${{ hashFiles('.github/workflows/golf.yml') }}
          restore-keys: rlib-golf-${{ runner.os }}-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'p<-c("data.table","jsonlite","httr2","xgboost","nnet"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'

      - name: Run golf model
        working-directory: golf-modeling
        run: |
          if [ -n "${{ github.event.inputs.results_date }}" ]; then
            Rscript engine/bet_hub.R --results "${{ github.event.inputs.results_date }}"
          else
            Rscript engine/bet_hub.R
            Rscript emit_elo.R || echo "emit_elo skipped"
          fi

      - name: Ingest to Supabase
        uses: ./.github/actions/ingest
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          feed-dir: ${{ github.workspace }}/_feed
