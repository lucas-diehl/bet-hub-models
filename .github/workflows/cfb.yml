name: cfb

# College-football picks + grading feed. Two live signals: UNDER totals (always on)
# and Arm O (proj_vs_open, tag OPEN_ATS) — betting the model against the OPENING
# line, which needs the number frozen as early in the week as possible (the edge
# decays toward kickoff). Replaces the local machine's CFB-PPP-Weekly +
# CFB-Open-Capture-Sun/-Mon tasks (all disabled — see DATA_SCIENTIST_HANDOFF.md
# §9/§5.3 for why those needed this).
#
# DAILY full run (not just Mon/Thu): CFB games finish on every day of the week
# (Tue-Mon), and weekly_update.R grades per-GAME as soon as it's final — a Mon/Thu-
# only cadence left games from other days ungraded for up to a week. weekly_update.R
# self-gates (idle check + "rebuild only if new completed games"), so a quiet day is
# cheap; this just makes sure a finished game is graded same-day/next-day, not later.
on:
  schedule:
    - cron: "0 13 * * *"   # daily ~09:00 ET — post + grade whatever finished (self-gated cost)
    - cron: "0 0 * * 1"    # Sun ~20:00 ET — capture opening lines ASAP (light, no rebuild)
    - cron: "0 10 * * 1"   # Mon ~06:00 ET — capture opening lines again, before the 09:00 rebuild
  workflow_dispatch:
    inputs:
      season:
        description: "PPP_SEASON (blank = auto)"
        required: false
      week:
        description: "PPP_WEEK (blank = auto)"
        required: false

concurrency:
  group: cfb
  cancel-in-progress: false

permissions:
  contents: write   # commit the append-only opening-line ledger back

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_DIR: ${{ github.workspace }}/_feed
      R_LIBS_USER: ${{ github.workspace }}/.rlib
      CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
      ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}   # 09_capture_open_lines.R expects this name
      PPP_MODE: LIVE
      PPP_SEASON: ${{ github.event.inputs.season }}
      PPP_WEEK: ${{ github.event.inputs.week }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-cfb-${{ runner.os }}-${{ hashFiles('.github/workflows/cfb.yml') }}
          restore-keys: rlib-cfb-${{ runner.os }}-

      # Cache ONLY pbp_data.rds — the one artifact that is huge (529MB local) and slow
      # to refetch. Everything else in data_cache is small and now COMMITTED to the repo
      # (drive_data / team_game_ppp / asof_ratings / features / dvoa / game_info /
      # betting_lines / opening_lines.csv), so the runner starts from known-good history
      # instead of whatever a cache happened to hold.
      #
      # Why this changed: caching the whole data_cache directory meant the runner only
      # ever had the CURRENT season (pbp is refreshed one season at a time, and the cache
      # was ~19MB — no historical pbp at all). 01 then rebuilt drive_data from that single
      # season and overwrote the multi-season file, so calibration in 07/08 (needs >=500
      # completed games) failed EVERY run with "Not enough completed history to calibrate".
      # The workflow still reported success, so CFB silently published nothing for days.
      - name: Restore pbp cache
        uses: actions/cache/restore@v4
        with:
          path: cfb-modeling/data_cache/pbp_data.rds
          key: cfb-pbp-${{ github.run_id }}
          restore-keys: cfb-pbp-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'p<-c("cfbfastR","dplyr","tidyr","stringr","lubridate","zoo","purrr","readr","tibble","jsonlite","xgboost","httr2","httr"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'

      - name: Run cfb (full daily rebuild + manual; opening-line capture only on the extra Sun/Mon crons)
        working-directory: cfb-modeling
        run: |
          mkdir -p data_cache   # cold runner may have no cache dir yet
          case "${{ github.event.schedule }}" in
            "0 0 * * 1"|"0 10 * * 1")
              echo "=== opening-line capture only ==="
              Rscript 09_capture_open_lines.R ;;
            *)
              echo "=== full weekly rebuild (writes + grades the feed; also runs 09 as a backstop) ==="
              Rscript weekly_update.R ;;
          esac

      - name: Ingest to Supabase
        uses: ./.github/actions/ingest
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          feed-dir: ${{ github.workspace }}/_feed

      - name: Save pbp cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cfb-modeling/data_cache/pbp_data.rds
          key: cfb-pbp-${{ github.run_id }}

      # The opening-line ledger is append-only and must survive past any cache — it
      # records the OPENING price we graded Arm O against, and is not refetchable once
      # the line moves. Commit it back whenever a capture added rows.
      - name: Persist opening-line ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cfb-modeling/data_cache/opening_lines.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ledger unchanged"
          else
            git commit -m "cfb: opening-line ledger capture [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "ledger push failed (non-fatal)"
          fi
