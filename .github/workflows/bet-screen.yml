name: bet-screen

# NBA player-prop picks for the Bet Hub feed (source "bet-screen", sport "nba").
#   grade  grade the PRIOR day's archived picks against real box scores (free, ESPN's site
#          API), write results_<date>.json, and append that day's games to
#          player_games_<season>.csv.
#   post   fetch live DraftKings/FanDuel/BetMGM props, match the segments in
#          bet-screen/src/nba_model/segments.py against the minutes EWMA (read from
#          player_games_<season>.csv, kept current by grade above -- post does not refresh
#          it itself, see grade_props_slate.py's docstring), write picks_<date>.json.
#
# ============================================================================
# Scheduling history -- read before touching the cron below
# ============================================================================
# v1: one cron per job ("17 11" grade, "23 13" post), chosen by matching the literal cron
#     string in github.event.schedule. Failed on 2026-10-28: the post cron never fired at
#     all, leaving the board on a stale 3-pick manual run from the night before.
# v2 (2026-10-28): both jobs run together on every firing (grade then post, sequential --
#     removes the ordering dependency too) plus a second schedule entry ~3h later as a
#     catch-up. Still failed the very next day, 2026-10-29: NEITHER of the two scheduled
#     crons fired at all (confirmed via `gh run list` -- zero runs that day until triggered
#     by hand), and nfl.yml -- a different workflow in this same repo, unrelated code --
#     also had zero scheduled runs that same day while OTHER workflows (dfs/train/golf)
#     fired fine. GitHub Actions schedule events are best-effort with no latency or
#     delivery guarantee; redundancy at the scale of 2 crons/day was not enough.
# v3 (this version): run the check every ~12 minutes across the whole relevant window
#     instead of at 2 fixed times. Each firing is cheap and safe to no-op (see the
#     already-posted-today guard below), so this converts "did GitHub deliver these exact
#     2 events" into "did GitHub deliver at least 1 of ~40 events spread across 8 hours" --
#     the failure mode would have to be near-total to still lose a day. Public repo, so
#     GitHub-hosted runner minutes are free regardless of how often this fires.
# ============================================================================
#
# Cron is UTC-fixed, so the ET offset drifts ~1h during EST -- irrelevant now that this
# runs every ~12 min across the whole window rather than at one precise clock time.
on:
  schedule:
    # Every 12 min, 13:00-20:48 UTC (~8am-3:48pm ET) -- covers the original "~09:23 ET
    # grade+post" and "~12:41 ET catch-up" intent many times over. Explicit minute list
    # (not */12) so every firing lands off the top of the hour, dodging the queue
    # congestion GitHub's own guidance warns about (confirmed costing this exact workflow
    # 3-7h delays when it used to run on "0 12"/"0 14").
    - cron: "3,15,27,39,51 13-20 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "post | grade | blank = run both, grade then post (what the schedule does)"
        required: false
      force:
        description: "post/blank only: true = post even if today's picks already exist (bypasses the already-posted-today guard, still costs live Odds-API credits)"
        required: false
        default: "false"
      as_of:
        description: "post only: YYYY-MM-DD to replay from cached data (zero Odds-API cost). Blank = live."
        required: false
      date:
        description: "grade only: YYYY-MM-DD to grade. Blank = yesterday (UTC)."
        required: false
      dry_run:
        description: "post only: true = print picks, write nothing (safe with --as-of for testing)"
        required: false
        default: "false"

concurrency:
  group: bet-screen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_DIR: ${{ github.workspace }}/_feed
      ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Rolling key: restore the newest prior bet-screen/data (season box-score cache +
      # picks archive used by the next day's grade step), save a fresh copy each run.
      - name: Restore bet-screen data (box-score cache + picks archive)
        uses: actions/cache/restore@v4
        with:
          path: |
            bet-screen/data/processed
            bet-screen/data/picks_archive
          key: bet-screen-data-${{ github.run_id }}
          restore-keys: bet-screen-data-

      - name: Install dependencies
        working-directory: bet-screen
        run: pip install -e .

      - name: Run bet-screen job(s)
        working-directory: bet-screen
        run: |
          JOB="${{ github.event.inputs.job }}"
          FORCE="${{ github.event.inputs.force }}"
          echo "bet-screen job = ${JOB:-both (grade, post)}  force=${FORCE:-false}"

          run_grade() {
            # No box-score refresh needed here -- grade_props_slate.py keeps
            # player_games_<season>.csv current via ESPN itself (see its docstring).
            ARGS=""
            if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
            python scripts/grade_props_slate.py $ARGS
          }
          run_post() {
            ARGS=""
            if [ -n "${{ github.event.inputs.as_of }}" ]; then ARGS="--as-of ${{ github.event.inputs.as_of }}"; fi
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            python scripts/live_fetch_props_slate.py $ARGS
          }
          # Running every ~12 min means most firings must be a no-op, or this would burn
          # live Odds-API credits ~40x/day instead of ~once. Gate on whether today's picks
          # already exist: the FIRST firing each day that successfully completes writes
          # data/picks_archive/picks_<today>.json, which is cache-persisted, so every later
          # firing that day sees it and skips the real fetch. --force (manual dispatch only)
          # bypasses this for testing / an intentional same-day re-post.
          already_posted() {
            [ "$FORCE" = "true" ] && return 1
            [ -f "data/picks_archive/picks_$(date -u +%F).json" ]
          }

          case "$JOB" in
            grade) run_grade ;;
            post)  run_post ;;
            # `|| true` on grade: a grade-step failure must not prevent post from being
            # attempted too -- the whole point of running both here is to not have a single
            # failure point silently take out the day's board.
            *)     run_grade || true
                   if already_posted; then
                     echo "today's picks already exist -- skipping post (no live-odds re-fetch)"
                   else
                     run_post
                   fi ;;
          esac

      - name: Ingest to Supabase
        uses: ./.github/actions/ingest
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          feed-dir: ${{ github.workspace }}/_feed
          # Each day's picks file is the full, authoritative set for that (source, sport,
          # slate_date) -- if a re-run (narrower segments.py, re-fetched odds, etc.) drops
          # a previously-posted ungraded bet, it should disappear from the board too, not
          # linger as a stray row forever.
          reconcile: "true"

      - name: Save bet-screen data (box-score cache + picks archive)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bet-screen/data/processed
            bet-screen/data/picks_archive
          key: bet-screen-data-${{ github.run_id }}
