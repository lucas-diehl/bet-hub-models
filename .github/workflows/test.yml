name: test

# Fast schema/contract tests. Runs on every PR and on pushes to main so the
# validate_projection() contract (the engine's projection schema boundary) can't
# silently regress -- the class of bug that let baseline projections ship to prod.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-test-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: rlib-test-${{ runner.os }}-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'p<-c("data.table","jsonlite","httr2","xgboost","openxlsx","DBI","duckdb","nnet"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'

      - name: Run tests
        working-directory: dfs-engine
        run: Rscript tests/test_validate_projection.R
      - name: Simulator/engine parity
        working-directory: dfs-engine
        run: |
          Rscript tests/parity/gen_fixture.R
          node tests/parity/parity.js
