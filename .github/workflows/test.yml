name: test

# Fast schema/contract tests. Runs on every PR and on pushes to main so the
# validate_projection() contract (the engine's projection schema boundary) can't
# silently regress -- the class of bug that let baseline projections ship to prod.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-test-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: rlib-test-${{ runner.os }}-

      - name: Install R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          # stringi ships a compiled .so linked against a specific system ICU version; the
          # cached R_LIBS_USER persists it across runs, so it goes stale the moment GitHub
          # bumps the runner image (same failure as cfb.yml, see that file's comment --
          # confirmed live here 2026-11-02, failing `test` on every push since).
          # Probe before trusting "already installed" from the cache, reinstall if broken.
          Rscript -e 'ok <- tryCatch({ library(stringi); TRUE }, error = function(e) { cat("stringi failed to load from cache:", conditionMessage(e), "\n"); FALSE }); if (!ok) { cat("forcing a fresh stringi reinstall\n"); install.packages("stringi") }'
          Rscript -e 'p<-c("data.table","jsonlite","httr2","xgboost","openxlsx","DBI","duckdb","nnet","lpSolve"); i<-p[!p %in% rownames(installed.packages())]; if(length(i)) install.packages(i)'

      - name: Run tests
        working-directory: dfs-engine
        run: |
          Rscript tests/test_validate_projection.R
          Rscript tests/test_scoring_roster.R
          Rscript tests/test_regime_correlation.R
          Rscript tests/test_nfl_qb_starters.R
          Rscript tests/test_nfl_active_roster.R
          Rscript tests/test_dk_slate_options.R
      - name: Simulator/engine parity
        working-directory: dfs-engine
        run: |
          Rscript tests/parity/gen_fixture.R
          node tests/parity/parity.js
