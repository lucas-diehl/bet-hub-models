name: Ingest feed to Supabase
description: >
  Upsert every JSON the model just wrote under FEED_DIR into Supabase, using the
  bet-dashboard ingest package (validates against the contract, then upserts).
inputs:
  database-url:
    description: Supabase Postgres connection string
    required: true
  feed-dir:
    description: Absolute path the model wrote its feed JSON to
    required: true
  post-to-x:
    description: >
      Set 'true' to also announce newly-ingested picks/results on X after this ingest.
      Opt-in per caller — dfs.yml does not set this, so DFS lineups never post.
    required: false
    default: "false"
  x-api-key:
    required: false
  x-api-secret:
    required: false
  x-access-token:
    required: false
  x-access-token-secret:
    required: false
runs:
  using: composite
  steps:
    - name: Checkout bet-dashboard (ingest lives here)
      uses: actions/checkout@v4
      with:
        repository: lucas-diehl/bet-dashboard
        path: _site
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: _site/pnpm-lock.yaml
    - name: Install + ingest
      shell: bash
      working-directory: _site
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        FEED_DIR: ${{ inputs.feed-dir }}
      run: |
        mkdir -p "$FEED_DIR"   # ensure it exists so an empty feed (e.g. preseason) is a clean no-op
        pnpm install --frozen-lockfile
        pnpm --filter @bet/ingest start

    # Batches whatever's newly-posted/newly-graded since the last successful run into at
    # most 2 tweets (see apps/ingest/src/tweet.ts). Reuses the checkout above rather than
    # a separate step needing its own clone. Silently no-ops if the X secrets aren't
    # passed (post-to-x defaults false) — dfs.yml just never sets these inputs.
    - name: Post new picks/results to X
      if: inputs.post-to-x == 'true'
      shell: bash
      working-directory: _site
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        X_API_KEY: ${{ inputs.x-api-key }}
        X_API_SECRET: ${{ inputs.x-api-secret }}
        X_ACCESS_TOKEN: ${{ inputs.x-access-token }}
        X_ACCESS_TOKEN_SECRET: ${{ inputs.x-access-token-secret }}
      run: pnpm --filter @bet/ingest tweet
